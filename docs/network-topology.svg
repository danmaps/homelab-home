<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Conductor home lab network topology</title>
  <desc id="desc">Tailnet clients connect to the Conductor Dell OptiPlex host at 100.87.16.33. The host runs the homelab dashboard, user-facing applications, and internal data services across Docker and systemd.</desc>
  <style>
    :root { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .bg { fill: #f8fafc; }
    .title { fill: #172033; font-size: 27px; font-weight: 700; }
    .subtitle { fill: #526074; font-size: 14px; }
    .zone { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 7; }
    .zone-label { fill: #526074; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .edge { fill: none; stroke: #64748b; stroke-width: 2.5; }
    .edge-dashed { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; }
    .node { stroke: #334155; stroke-width: 1.5; }
    .client { fill: #dbeafe; }
    .host { fill: #c7d2fe; }
    .app { fill: #ccfbf1; }
    .data { fill: #fef3c7; }
    .admin { fill: #e2e8f0; }
    .label { fill: #172033; font-size: 16px; font-weight: 700; }
    .body { fill: #334155; font-size: 13px; }
    .small { fill: #526074; font-size: 12px; }
    .legend { fill: #172033; font-size: 12px; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="760" rx="18"/>
  <text class="title" x="56" y="58">Conductor home lab</text>
  <text class="subtitle" x="56" y="84">Tailnet-first access map · snapshot 30 September 2026</text>

  <rect class="zone" x="34" y="112" width="240" height="512" rx="16"/>
  <text class="zone-label" x="58" y="145">Tailnet clients</text>
  <rect class="zone" x="306" y="112" width="860" height="512" rx="16"/>
  <text class="zone-label" x="330" y="145">Conductor · 100.87.16.33</text>

  <!-- connectors first -->
  <path class="edge" marker-end="url(#arrow)" d="M190 244 C250 244 258 244 348 244"/>
  <path class="edge" marker-end="url(#arrow)" d="M190 344 C250 344 258 344 348 344"/>
  <path class="edge" marker-end="url(#arrow)" d="M190 444 C250 444 258 444 348 444"/>
  <path class="edge-dashed" d="M522 300 L522 358"/>
  <path class="edge" marker-end="url(#arrow)" d="M694 244 C754 244 758 244 818 244"/>
  <path class="edge" marker-end="url(#arrow)" d="M694 404 C754 404 758 404 818 404"/>
  <path class="edge" marker-end="url(#arrow)" d="M522 480 L522 548"/>
  <path class="edge" marker-end="url(#arrow)" d="M694 548 L818 548"/>

  <!-- clients -->
  <rect class="node client" x="62" y="202" width="156" height="72" rx="12"/>
  <text class="label" x="84" y="231">iPad</text>
  <text class="body" x="84" y="253">tailnet client</text>

  <rect class="node client" x="62" y="302" width="156" height="72" rx="12"/>
  <text class="label" x="84" y="331">iPhone devices</text>
  <text class="body" x="84" y="353">tailnet clients</text>

  <rect class="node client" x="62" y="402" width="156" height="72" rx="12"/>
  <text class="label" x="84" y="431">Windows desktop</text>
  <text class="body" x="84" y="453">tailnet client</text>

  <!-- host and access layer -->
  <rect class="node host" x="348" y="202" width="346" height="98" rx="14"/>
  <text class="label" x="372" y="235">Conductor host</text>
  <text class="body" x="372" y="258">Dell OptiPlex 9020 · Docker + systemd</text>
  <text class="small" x="372" y="280">private access over Tailscale</text>

  <rect class="node admin" x="348" y="358" width="346" height="68" rx="12"/>
  <text class="label" x="372" y="387">homelab-home · :3499</text>
  <text class="body" x="372" y="408">service index and access map</text>

  <rect class="node admin" x="348" y="470" width="346" height="68" rx="12"/>
  <text class="label" x="372" y="499">systemd applications</text>
  <text class="body" x="372" y="520">McVey HQ · Resume Tailor · reports</text>

  <!-- service groups -->
  <rect class="node app" x="818" y="202" width="304" height="118" rx="14"/>
  <text class="label" x="842" y="235">User-facing apps</text>
  <text class="body" x="842" y="260">Open WebUI :8080</text>
  <text class="body" x="842" y="281">CamReview :3510 · Rowan :3017</text>
  <text class="body" x="842" y="302">Symphony UI :18080</text>

  <rect class="node app" x="818" y="358" width="304" height="92" rx="14"/>
  <text class="label" x="842" y="391">Media + published services</text>
  <text class="body" x="842" y="416">Immich :2283</text>
  <text class="body" x="842" y="437">tailnet-bound ports</text>

  <rect class="node data" x="818" y="510" width="304" height="92" rx="14"/>
  <text class="label" x="842" y="543">Data + admin plane</text>
  <text class="body" x="842" y="568">Umami :3002 · Postgres :5433</text>
  <text class="body" x="842" y="589">Adminer :8081 · internal dependencies</text>

  <text class="legend" x="56" y="674">Blue = clients</text>
  <text class="legend" x="190" y="674">Purple = host</text>
  <text class="legend" x="310" y="674">Teal = apps</text>
  <text class="legend" x="420" y="674">Yellow = data/admin</text>
  <text class="small" x="56" y="704">Ports shown are the current host bindings; service health and public exposure can change independently.</text>
</svg>
