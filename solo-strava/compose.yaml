# Linux home-lab only. Host networking keeps the downstream PulsHealth APIs
# on localhost and requires no new published container port.
services:
  atlas:
    build: ./atlas
    network_mode: host
    env_file: .env
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:mode=1777