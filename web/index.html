<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>conductor // access</title>
  <style>
    :root {
      --bg: #050705;
      --bg-soft: #0c100c;
      --panel: rgba(10, 13, 10, 0.96);
      --panel-2: rgba(13, 17, 13, 0.98);
      --panel-3: rgba(9, 12, 9, 0.99);
      --line: rgba(132, 255, 173, 0.12);
      --line-strong: rgba(132, 255, 173, 0.24);
      --text: #f0f7f0;
      --muted: #a5b7a6;
      --muted-2: #708271;
      --accent: #7dff9f;
      --accent-2: #b9ffca;
      --good: #7dff9f;
      --warn: #f1d16b;
      --danger: #ff8c8c;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.42);
      --radius: 6px;
      --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: var(--sans);
      background:
        radial-gradient(circle at top left, rgba(125, 255, 159, 0.09), transparent 24%),
        linear-gradient(180deg, rgba(255,255,255,0.014) 0, rgba(255,255,255,0) 100%),
        repeating-linear-gradient(to bottom, rgba(255,255,255,0.018) 0, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 4px),
        linear-gradient(180deg, #040604 0%, #0a0d0a 45%, #050705 100%);
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.008) 0, transparent 16%, rgba(255,255,255,0.008) 32%, transparent 48%, rgba(255,255,255,0.008) 64%, transparent 100%);
      opacity: 0.22;
    }

    a { color: inherit; text-decoration: none; }

    .shell {
      position: relative;
      max-width: 1480px;
      margin: 0 auto;
      padding: 12px 12px 40px;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      color: var(--muted-2);
      font: 11px/1.2 var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.22em;
    }

    .hero {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }

    .frame {
      position: relative;
      border-radius: var(--radius);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.005)),
        var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
      isolation: isolate;
    }

    .frame::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--line-strong), transparent);
      pointer-events: none;
    }

    .frameGlow {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top right, rgba(125, 255, 159, 0.08), transparent 28%),
        linear-gradient(180deg, rgba(125, 255, 159, 0.03), transparent 45%);
      pointer-events: none;
      z-index: -1;
    }

    .heroMain {
      padding: 0;
      min-height: 100%;
    }

    .heroGrid {
      display: grid;
      gap: 16px;
      padding: 16px;
    }

    .eyebrow,
    .kicker,
    .sectionTitle,
    .label,
    .serviceLabel {
      font-family: var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 11px;
      margin-bottom: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      background: linear-gradient(90deg, rgba(125, 255, 159, 0.06), transparent 38%);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.7rem, 14vw, 6.3rem);
      line-height: 0.86;
      letter-spacing: -0.08em;
      font-weight: 900;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(125, 255, 159, 0.08);
    }

    .slash {
      color: var(--accent);
      display: block;
      margin-top: 8px;
      font-size: 0.44em;
      letter-spacing: 0.12em;
    }

    .heroCopy {
      display: grid;
      gap: 14px;
      max-width: 78ch;
    }

    .heroMeta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 2px;
    }

    .metaChip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 6px 9px;
      border-radius: 3px;
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      font: 500 11px/1 var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .metaChip.live {
      color: var(--accent);
      background: rgba(125, 255, 159, 0.08);
    }

    .sub {
      color: var(--muted);
      margin: 0;
      line-height: 1.6;
      font-size: 13px;
      max-width: 64ch;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0;
      background: rgba(255,255,255,0.018);
      border-radius: 4px;
      overflow: hidden;
    }

    .metric {
      padding: 12px 12px 14px;
      background: rgba(255, 255, 255, 0.015);
      min-height: 78px;
    }

    .metric:nth-child(odd) {
      border-right: 1px solid rgba(255,255,255,0.05);
    }

    .metric:nth-child(-n+2) {
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .metricValue {
      display: block;
      font: 700 clamp(1.05rem, 6vw, 1.45rem)/1 var(--mono);
      color: var(--text);
      margin-top: 8px;
      letter-spacing: 0.04em;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 2px;
    }

    button,
    .ghostBtn,
    .primaryLink,
    .secondaryLink {
      appearance: none;
      border: 0;
      border-radius: 4px;
      min-height: 44px;
      padding: 11px 14px;
      cursor: pointer;
      color: var(--text);
      font: 600 13px/1.2 var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(255,255,255,0.04);
      transition: transform 120ms ease, background 120ms ease, box-shadow 120ms ease, color 120ms ease;
    }

    button:hover,
    .ghostBtn:hover,
    .primaryLink:hover,
    .secondaryLink:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,0.065);
    }

    button:active,
    .ghostBtn:active,
    .primaryLink:active,
    .secondaryLink:active {
      transform: translateY(0);
    }

    .primaryBtn,
    .primaryLink {
      background: linear-gradient(180deg, rgba(125, 255, 159, 0.16), rgba(125, 255, 159, 0.08));
      color: #60ad71;
      box-shadow: inset 0 -1px 0 rgba(0,0,0,0.18);
    }

    .secondaryLink,
    .ghostBtn {
      color: var(--muted);
      background: rgba(255,255,255,0.022);
    }

    .heroAside {
      display: grid;
      gap: 12px;
      padding: 16px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.006)),
        var(--panel-2);
    }

    .asideBlock {
      display: grid;
      gap: 8px;
      padding: 10px 0;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .asideBlock:first-of-type { border-top: 0; padding-top: 0; }

    .label {
      color: var(--muted-2);
      font-size: 10px;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .pillRow,
    .statusRow {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      max-width: 100%;
      overflow-wrap: anywhere;
      padding: 6px 9px;
      border-radius: 3px;
      background: rgba(255,255,255,0.036);
      color: var(--muted);
      font: 500 11px/1.2 var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .pill.good { color: var(--good); background: rgba(125, 255, 159, 0.09); }
    .pill.warn { color: var(--warn); background: rgba(241, 209, 107, 0.08); }
    .pill.info { color: var(--accent-2); background: rgba(185, 255, 202, 0.08); }
    .pill.danger { color: var(--danger); background: rgba(255, 140, 140, 0.08); }

    .sectionBar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 12px;
      padding: 0 2px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .sectionTitle {
      color: var(--text);
      font-size: 12px;
      margin: 0;
    }

    .sectionNote {
      color: var(--muted-2);
      font: 11px/1.4 var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .serviceGrid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .serviceGrid::before {
      content: "";
      display: block;
      grid-column: 1 / -1;
      height: 1px;
      background: rgba(255,255,255,0.04);
      margin-bottom: -2px;
    }

    .card {
      position: relative;
      display: grid;
      gap: 14px;
      align-content: start;
      padding: 16px;
      border-radius: 4px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.008)),
        repeating-linear-gradient(to bottom, rgba(255,255,255,0.018) 0, rgba(255,255,255,0.018) 1px, transparent 1px, transparent 4px),
        var(--panel-3);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), var(--shadow);
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 2px;
      background: linear-gradient(90deg, rgba(125, 255, 159, 0.55), rgba(125, 255, 159, 0.08));
      pointer-events: none;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .cardHead {
      display: grid;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .svcname {
      margin-top: 6px;
      font-size: 1.02rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .serviceLabel {
      color: var(--muted-2);
      font-size: 10px;
    }

    .mono {
      font-family: var(--mono);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .meta {
      display: grid;
      gap: 10px;
    }

    .metaLine {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .actionRow {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    details.preview {
      margin-top: 2px;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 10px;
    }

    details.preview summary {
      list-style: none;
      cursor: pointer;
      color: var(--accent-2);
      font: 600 12px/1.2 var(--mono);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    details.preview summary::-webkit-details-marker { display: none; }

    iframe {
      width: 100%;
      height: 55vh;
      margin-top: 10px;
      border: 0;
      border-radius: 2px;
      background: #020203;
    }

    @media (min-width: 680px) {
      .shell { padding: 16px 16px 48px; }
      .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .serviceGrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .actionRow { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (min-width: 960px) {
      .hero {
        grid-template-columns: minmax(0, 1.45fr) minmax(330px, 0.78fr);
        align-items: stretch;
      }

      .heroAside { padding: 18px; }
      .heroGrid {
        grid-template-columns: minmax(0, 1.1fr) minmax(260px, 0.62fr);
        align-items: end;
        padding: 18px 20px 20px;
      }
      .metrics { grid-template-columns: 1fr; }
      .metric:nth-child(odd) { border-right: 0; }
      .metric:nth-child(-n+2) { border-bottom: 1px solid rgba(255,255,255,0.05); }
      .metric:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.05); }
      .serviceGrid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    }

    @media (min-width: 1280px) {
      .serviceGrid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .card { min-height: 250px; }
    }

    @media (max-width: 679px) {
      .topline {
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }

      .heroGrid {
        padding: 0;
      }

      .heroCopy {
        padding: 0 14px 14px;
      }

      .heroMeta {
        gap: 6px;
      }

      .metaChip {
        flex: 1 1 calc(50% - 6px);
        justify-content: center;
      }

      .metrics {
        margin: 0 14px 14px;
      }

      .heroAside {
        gap: 10px;
      }

      .serviceGrid {
        gap: 10px;
      }

      .card {
        padding: 14px;
      }

      .actionRow {
        gap: 8px;
      }

      h1 {
        font-size: clamp(2.45rem, 15vw, 4rem);
      }
    }
  </style>
</head>
<body>
  <div class="shell">

    <section class="hero">
      <div class="frame heroMain">
        <div class="frameGlow"></div>
        <div class="heroGrid">
          <div class="heroCopy">
            <div class="heroMeta">
            </div>
            <div>
              <h1>CONDUCTOR <span class="slash">// ACCESS</span></h1>
            </div>
            <div class="controls">
              <button class="primaryBtn" id="btnRefresh">Refresh grid</button>
              <button id="btnReport">Send report</button>
            </div>
          </div>

          <div class="metrics">
            <div class="metric">
              <div class="label">Services indexed</div>
              <span class="metricValue" id="metricServices">--</span>
            </div>
            <div class="metric">
              <div class="label">Reachable routes</div>
              <span class="metricValue" id="metricReachable">--</span>
            </div>
            <div class="metric">
              <div class="label">Last sync</div>
              <span class="metricValue" id="updated">--</span>
            </div>
            <div class="metric">
              <div class="label">Mode</div>
              <span class="metricValue" id="metricMode">MOBILE</span>
            </div>
          </div>
        </div>
      </div>

      <aside class="frame heroAside">
        <div>
        </div>

        <div class="pillRow">
          <span class="pill good">Tailnet</span>
          <span class="pill info">Published port</span>
          <span class="pill warn">Internal</span>
          <span class="pill danger">Probe cold</span>
        </div>


        <div class="asideBlock">
          <div class="statusRow">
            <span class="pill" id="tailscaleIp">TAILSCALE // --</span>
            <span class="pill" id="lanIp">LAN // --</span>
          </div>
        </div>
      </aside>
    </section>

    <section>
      <div class="sectionBar">
      </div>
      <div class="serviceGrid" id="cards"></div>
    </section>
  </div>

<script>
  const els = {
    cards: document.getElementById('cards'),
    btnRefresh: document.getElementById('btnRefresh'),
    btnReport: document.getElementById('btnReport'),
    updated: document.getElementById('updated'),
    metricServices: document.getElementById('metricServices'),
    metricReachable: document.getElementById('metricReachable'),
    metricMode: document.getElementById('metricMode'),
    tailscaleIp: document.getElementById('tailscaleIp'),
    lanIp: document.getElementById('lanIp'),
  };

  function accessPill(result){
    if (result?.reason === 'no-published-port') return '<span class="pill warn">INTERNAL</span>';
    const host = result?.host || '';
    if (host.startsWith('100.')) return '<span class="pill good">TAILNET</span>';
    if (host === '0.0.0.0') return '<span class="pill info">PUBLISHED PORT</span>';
    if (host) return '<span class="pill good">DIRECT</span>';
    return '<span class="pill warn">UNKNOWN</span>';
  }

  function probePill(result){
    if (result?.reason === 'no-published-port') return '<span class="pill warn">NO HOST PORT</span>';
    if (result?.ok) return '<span class="pill good">PROBE OK</span>';
    return '<span class="pill danger">PROBE COLD</span>';
  }

  function accessHint(result){
    if (result?.reason === 'no-published-port') return 'No published host port; likely internal-only, dependency-only, or intentionally not exposed.';
    if (result?.ok) return 'Route probe succeeded from the dashboard container context.';
    return 'Route exists but probe was not fully verified from the dashboard container.';
  }

  function makeUrl(result, service, fallbackHost){
    if (service.publicUrl) return service.publicUrl;
    if (!result?.host || !result?.port) return '';
    const host = result.host === '0.0.0.0' ? (fallbackHost || result.host) : result.host;
    return `http://${host}:${result.port}${service.path || '/'}`;
  }

  function routeSummary(result, service){
    if (service.publicUrl) return service.publicUrl;
    if (!result?.host || !result?.port) return 'unmapped';
    return `${result.host}:${result.port}`;
  }

  function cardForService(service, result, fallbackHost){
    const url = makeUrl(result, service, fallbackHost);
    return `
      <article class="card">
        <div class="cardHead">
          <div class="row">
            <div>
              <div class="serviceLabel">${service.source || 'service'} // ${service.containerName || service.key}</div>
              <div class="svcname">${service.name}</div>
            </div>
            ${accessPill(result)}
          </div>

          <div class="metaLine">
            ${probePill(result)}
            <span class="pill">PORT ${service.port || 'n/a'}</span>
            ${service.containerPort ? `<span class="pill">CTR ${service.containerPort}</span>` : ''}
          </div>
        </div>

        <div class="meta">
          <div class="metaLine">
            <span class="pill">ROUTE ${routeSummary(result, service)}</span>
          </div>
          <p class="hint">${accessHint(result)}</p>
        </div>

        <div class="actionRow">
          ${url ? `<a class="primaryLink" href="${url}" target="_blank" rel="noreferrer">Open service</a>` : `<span class="secondaryLink">No direct URL</span>`}
          ${service.repoUrl ? `<a class="secondaryLink" href="${service.repoUrl}" target="_blank" rel="noreferrer">Open repo</a>` : ''}
        </div>

        ${url ? `<details class="preview"><summary>Inline preview</summary><iframe src="${url}"></iframe></details>` : ''}
      </article>
    `;
  }

  function summarize(j){
    const lines = ['Homelab report', '', `App: ${location.origin}`, `Updated: ${j.updatedAt}`, ''];
    for (const svc of (j.services || [])) {
      const result = j.results?.[svc.key] || {};
      const label = result.reason === 'no-published-port' ? 'INTERNAL' : (result.host && result.host.startsWith('100.') ? 'TAILNET' : (result.host ? 'PUBLISHED PORT' : 'UNKNOWN'));
      lines.push(`- ${svc.name} (${svc.containerName || svc.key}) ${label} ${result.host ? `${result.host}:${result.port}` : ''}`.trim());
    }
    lines.push('', 'Request: please help me fix what looks off.');
    return lines.join('\n');
  }

  function makeTelegramLink(username, text){
    const u = (username || '').replace(/^@/, '');
    return `https://t.me/${u}?text=${encodeURIComponent(text)}`;
  }

  async function load(){
    const r = await fetch('/api/status');
    const j = await r.json();
    const updated = new Date(j.updatedAt);
    const services = j.services || [];
    const results = j.results || {};
    const reachable = services.filter((svc) => results?.[svc.key]?.ok).length;
    const fallbackHost = j?.ips?.tailscale || '100.87.16.33';

    els.updated.textContent = updated.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    els.metricServices.textContent = String(services.length).padStart(2, '0');
    els.metricReachable.textContent = `${String(reachable).padStart(2, '0')} / ${String(services.length).padStart(2, '0')}`;
    els.metricMode.textContent = window.innerWidth < 680 ? 'MOBILE' : (window.innerWidth < 960 ? 'FIELD' : 'WIDE');
    els.tailscaleIp.textContent = `TAILSCALE // ${j?.ips?.tailscale || 'NONE'}`;
    els.lanIp.textContent = `LAN // ${j?.ips?.lan || 'NONE'}`;
    els.cards.innerHTML = services.map((svc) => cardForService(svc, results?.[svc.key], fallbackHost)).join('');
    return j;
  }

  async function sendReport(){
    try {
      const j = await load();
      const reportText = summarize(j);
      const url = makeTelegramLink(j?.meta?.telegramUsername || 'danmaps_clawd_bot', reportText);

      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(reportText);
        }
      } catch {}

      window.location.href = url;
    } catch {
      const msg = 'Failed to load /api/status. Is homelab-home running?';
      alert(msg);
    }
  }

  els.btnRefresh.addEventListener('click', load);
  els.btnReport.addEventListener('click', sendReport);
  window.addEventListener('resize', () => {
    els.metricMode.textContent = window.innerWidth < 680 ? 'MOBILE' : (window.innerWidth < 960 ? 'FIELD' : 'WIDE');
  });
  load();
</script>
</body>
</html>
