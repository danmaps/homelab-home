services:
  homelab-home:
    build: .
    container_name: homelab-home
    ports:
      - "100.87.16.33:3499:3499"
    restart: unless-stopped
    environment:
      - PORT=3499
      - HOST=0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
